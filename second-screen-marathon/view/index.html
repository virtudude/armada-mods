<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* --u is one pixel of a 1080-line screen; the game's pictures are drawn at whole multiples of it */
  html { font-size: 3.4vh; --u: calc(100vh / 1080); }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  * { box-sizing: border-box; }
  img { image-rendering: pixelated; display: block; }
  /* the suit's status display: the game's own green pictures on black */
  body { --g: #00e600; --dim: #0a6a12; background: #000; color: var(--g); font: 700 .8rem "Noto Sans Mono", monospace; text-transform: uppercase; letter-spacing: .06rem;
         display: grid; grid-template-columns: calc(369 * var(--u)) minmax(0, 1fr); grid-template-rows: calc(369 * var(--u)) minmax(0, 1fr); gap: calc(14 * var(--u)); padding: calc(14 * var(--u)); }
  #sensor { position: relative; }
  #sensor > img { width: 100%; }
  #blips img { position: absolute; width: calc(27 * var(--u)); transform: translate(-50%, -50%); }
  #vitals { display: flex; flex-direction: column; justify-content: space-evenly; padding-left: calc(20 * var(--u)); }
  .l { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .3rem; } .l b { font-size: 1.15rem; }
  /* a bar of the game's: the empty one, with as much of the full one over it as there is left */
  .bar { position: relative; height: calc(112 * var(--u)); background: #031a05; }
  .bar img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #weapons { grid-column: 1 / -1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); grid-auto-rows: calc(184 * var(--u)); gap: calc(10 * var(--u)); }
  /* the weapon in hand, large, as the game's own display shows only that one, taking what room the others leave */
  #hero { grid-column: 1 / -1; --k: 4; display: flex; align-items: center; justify-content: space-evenly; border: calc(3 * var(--u)) solid var(--g); }
  #hero .n { font-size: 1.15rem; line-height: 1.5; white-space: normal; max-width: 34%; }
  /* what else is carried, three to a row */
  .w { min-width: 0; min-height: 0; overflow: hidden; border: calc(2 * var(--u)) solid var(--dim); display: flex; flex-direction: column; align-items: center; justify-content: center;
       gap: calc(6 * var(--u)); color: #06b41c; --k: 2; }
  .w:active { background: #0a4d12; }
  /* one other weapon alone takes the row */
  #weapons > .w:nth-child(2):last-child { grid-column: 1 / -1; }
  .w .n { max-width: 100%; font-size: .7rem; letter-spacing: 0; text-align: center; padding: 0 .3rem; }
  /* the pictures of a weapon and its rounds, each at its place on the game's display */
  .p { position: relative; flex: none; }
  .p > *, .r > *, .p div img + img { position: absolute; }
  /* the rounds change as the weapon fires, so a touch never lands on them */
  .r { display: contents; pointer-events: none; }
  .p div img + img { left: 0; top: 0; }
  /* a weapon that runs on a charge has a meter where others have bullets */
  .p u { display: flex; align-items: flex-end; background: #032a08; } .p u i { display: block; width: 100%; background: var(--g); }
  /* the game's emblem while there is no game to show */
  #idle { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; }
  #idle img { width: calc(332 * var(--u)); }
  #idle b { font-size: 1.5rem; letter-spacing: .5rem; margin-right: -.5rem; }
  #idle span { color: var(--dim); letter-spacing: .3rem; }
  #idle span::after { content: ""; display: inline-block; width: .55rem; height: .9rem; margin-left: .4rem; vertical-align: -.12rem; background: var(--g); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="sensor"><img id="mount"><div id="blips"></div></div>
<div id="vitals">
  <div><div class="l"><span>Shield</span><b id="sv"></b></div><div class="bar"><img id="sUnder"><img id="sOver"></div></div>
  <div><div class="l"><span>Oxygen</span><b id="ov"></b></div><div class="bar"><img id="oUnder"><img id="oOver"></div></div>
</div>
<div id="weapons"></div>
<div id="idle"><img id="emblem"><b>U.E.S.C. Marathon</b><span id="idleText">Opening link</span></div>
<script>
  const $ = id => document.getElementById(id);
  // The status display's own pictures, by their number in the game's shapes file, turned into files when the game is launched.
  const art = n => `${armada.data}art/${n}.png`;
  // one full shield charge, a full tank, and how far the motion sensor reaches
  const CHARGE = 150, TANK = 10800, RANGE = 8;
  // the bar for each shield charge, lying down: empty, then one, two and three times charged
  const SHIELD = ["bar1", "bar3", "bar54", "bar55"];
  // the first of the six pictures of a fading blip, by what it marks
  const BLIP = { alien: 23, friend: 29, "hostile player": 46 };
  let state = null, rack = "", n = 0;
  // the corner of the status display a weapon's pictures start from
  const corner = w => [Math.min(...w.pictures.map(p => p[1])), Math.min(...w.pictures.map(p => p[2]))];
  const show = (id, name) => { if ($(id).getAttribute("src") !== art(name)) $(id).src = art(name); };
  // a picture is drawn with each of its pixels --k of the screen's
  const sized = 'onload="this.style.width = `calc(${this.naturalWidth} * var(--k) * var(--u))`"';

  // Rounds at their place on the status display, x and y being the display's corner for this weapon:
  // rows of bullets, the empty row with the full one over it cut off where the rounds end, or a meter that fills upwards.
  const at = (t, x, y, row) => `left:calc(${t.x - x} * var(--k) * var(--u));top:calc(${t.y - y + (row || 0) * t.h} * var(--k) * var(--u))`;
  function rounds(t, x, y) {
    if (!t || !t.full) return "";
    if (t.picture === undefined) return `<u style="${at(t, x, y)};width:calc(${t.w} * var(--k) * var(--u));height:calc(${t.h} * var(--k) * var(--u))"><i style="height:${100 * t.rounds / t.full}%"></i></u>`;
    return Array.from({ length: Math.ceil(t.full / t.across) }, (_, row) => {
      const gone = 100 - 100 * Math.max(0, Math.min(t.across, t.rounds - row * t.across)) / t.across;
      return `<div style="${at(t, x, y, row)}"><img src="${art(t.empty)}" ${sized}><img src="${art(t.picture)}" ${sized} style="clip-path: inset(${t.rtl ? `0 ${gone}% 0 0` : `0 0 0 ${gone}%`})"></div>`; }).join("");
  }
  // a weapon as the status display shows it: its pictures, with a place for the rounds over them
  function panel(w) {
    if (!w.pictures.length) return "<span></span>";
    const [x, y] = corner(w);
    return `<div class="p">${w.pictures.map(([n, px, py]) => `<img src="${art(n)}" ${sized} style="${at({ x: px, y: py }, x, y)}">`).join("")}<span class="r" data-w="${w.id}"></span></div>`;
  }
  // a panel takes the size of what was put on it once its pictures have arrived
  function fit(el) {
    const kids = [...el.querySelectorAll(":scope > img")];
    if (kids.some(k => !k.naturalWidth)) return;
    el.style.width = Math.max(...kids.map(k => k.offsetLeft + k.offsetWidth)) + "px";
    el.style.height = Math.max(...kids.map(k => k.offsetTop + k.offsetHeight)) + "px";
  }

  function draw() {
    const s = state;
    if (!s || !s.weapons) { $("idle").style.display = ""; $("idleText").textContent = s ? "Standing by" : "Opening link"; return; }
    $("idle").style.display = "none";
    const energy = Math.max(0, s.energy), level = Math.max(0, Math.min(2, Math.ceil(energy / CHARGE) - 1)), within = energy - level * CHARGE;
    $("sv").textContent = energy >= CHARGE ? (energy / CHARGE).toFixed(1) + "x" : Math.round(100 * energy / CHARGE) + "%";
    show("sUnder", SHIELD[level]); show("sOver", SHIELD[level + 1]);
    $("sOver").style.clipPath = `inset(0 ${100 - 100 * within / CHARGE}% 0 0)`;
    $("ov").textContent = Math.round(100 * s.oxygen / TANK) + "%";
    $("oOver").style.clipPath = `inset(0 ${100 - 100 * s.oxygen / TANK}% 0 0)`;
    // a blip fades over its six steps; straight ahead is up
    $("blips").innerHTML = !s.sensor ? "" : s.blips.map(([type, age, distance, direction]) => {
      const r = Math.min(1, distance / RANGE) * 40, a = (direction - 90) * Math.PI / 180;
      return BLIP[type] === undefined ? "" : `<img src="${art(BLIP[type] + Math.min(5, age))}" style="left:${50 + Math.cos(a) * r}%;top:${50 + Math.sin(a) * r}%">`; }).join("");
    const label = w => `<div class="n">${w.count > 1 ? w.count + " &times; " : ""}${w.name.replace(/[<>&]/g, "")}</div>`;
    const held = s.weapons.find(w => w.id === s.desired), others = s.weapons.filter(w => w !== held);
    const html = `<div id="hero">${held ? label(held) + panel(held) : ""}</div>` +
      others.map(w => `<div class="w" data-w="${w.id}">${label(w)}${panel(w)}</div>`).join("");
    if (html !== rack) {
      $("weapons").innerHTML = html; rack = html;
      for (const el of document.querySelectorAll(".p")) { el.querySelectorAll("img").forEach(img => img.addEventListener("load", () => fit(el))); fit(el); }
    }
    // the weapons are only rebuilt when what is carried changes, so a tap is never lost to a redraw: rounds are filled in place
    for (const el of document.querySelectorAll(".r")) {
      const w = s.weapons.find(w => w.id === el.dataset.w), [x, y] = corner(w);
      const html = rounds(w.primary, x, y) + rounds(w.secondary, x, y);
      if (el.rounds !== html) el.innerHTML = el.rounds = html;
    }
  }

  $("mount").src = art(21); $("emblem").src = art(44);
  show("oUnder", "bar1"); show("oOver", "bar4");
  $("weapons").addEventListener("click", e => {
    const el = e.target.closest(".w");
    // the count tells the game's script one request from the next
    if (el && el.dataset.w) armada.send({ weapon: el.dataset.w, n: ++n });
  });
  armada.onState = s => { state = s; draw(); };
  state = armada.last;
  draw();
</script>
</body>
</html>
