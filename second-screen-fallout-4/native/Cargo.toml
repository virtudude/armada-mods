[package]
name = "armada-pipboy"
version = "0.2.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = { version = "0.45.1", default-features = false }
serde_json = "1.0.151"
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["x11", "rwh_06"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
